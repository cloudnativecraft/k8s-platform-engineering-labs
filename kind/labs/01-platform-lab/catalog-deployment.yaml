apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: catalog
spec:
  replicas: 3
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      nodeSelector:
        workload: applications
      containers:
        - name: catalog
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80 
          env:
            - name: APP_COLOR
              valueFrom:
                configMapKeyRef:
                  name: catalog-config
                  key: APP_COLOR
            - name: APP_ENV
              valueFrom: 
                secretKeyRef:
                  name: catalog-secret
                  key: APP_ENV
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3